api_call:
  fields:
    entry_id:
      required: false
      example: 0123456789abcdef0123456789abcdef
      selector:
        config_entry:
          integration: teyes
    device_id:
      required: false
      example: p1c25if16000100
      selector:
        text:
    api:
      required: false
      default: client
      selector:
        select:
          options:
            - client
            - car
            - track
            - acc
            - msg
            - file
            - update
            - ef
            - tmps
    path:
      required: true
      example: /user/getCarMqState
      selector:
        text:
    params:
      required: false
      example: '{"page": 1}'
      selector:
        object:

send_command:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: teyes
    device_id:
      required: false
      example: p1c25if16000100
      selector:
        text:
    command:
      required: true
      example: lockscreen
      selector:
        text:
    message:
      required: false
      example: '{}'
      selector:
        object:

get_trips:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: teyes
    device_id:
      required: false
      example: p1c25if16000100
      selector:
        text:
    count:
      required: false
      default: 20
      selector:
        number:
          min: 1
          max: 200
          mode: box

get_events:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: teyes
    device_id:
      required: false
      selector:
        text:
    count:
      required: false
      default: 20
      selector:
        number:
          min: 1
          max: 200
          mode: box

list_geofences:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: teyes
    device_id:
      required: false
      selector:
        text:

set_geofence:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: teyes
    device_id:
      required: false
      selector:
        text:
    latitude:
      required: true
      example: 32.0853
      selector:
        number:
          min: -90
          max: 90
          step: 0.0000001
          mode: box
    longitude:
      required: true
      example: 34.7818
      selector:
        number:
          min: -180
          max: 180
          step: 0.0000001
          mode: box
    radius:
      required: true
      example: 500
      selector:
        number:
          min: 1
          max: 100000
          unit_of_measurement: m
          mode: box

delete_geofence:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: teyes
    device_id:
      required: false
      selector:
        text:
    ids:
      required: true
      example: "123,124"
      selector:
        text:

send_navigation:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: teyes
    device_id:
      required: false
      selector:
        text:
    address:
      required: true
      example: "Dizengoff Center, Tel Aviv"
      selector:
        text:
    map_app:
      required: false
      default: google
      selector:
        select:
          options:
            - google
            - yandex
            - waze
            - gis

get_photo:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: teyes
    device_id:
      required: false
      selector:
        text:
    photo_id:
      required: true
      example: "123456"
      selector:
        text:
